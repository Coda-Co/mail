[workspace]
resolver = "2"
members = ["crates/mail-core", "src-tauri"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
tracing = "0.1"

# Dev builds: optimise dependencies (the HTML sanitiser is ~10x slower unoptimised) but
# keep the workspace's own crates fast to compile and debuggable.
[profile.dev.package."*"]
opt-level = 2
