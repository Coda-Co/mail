[package]
name = "mail-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Store refresh tokens in the OS credential store (Keychain, Credential Manager).
os-keyring = ["dep:keyring"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
ammonia = "4"
html-escape = "0.2"
urlencoding = "2"
iana-time-zone = "0.1"
chrono-tz = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"], optional = true }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"], optional = true }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
