<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f4ecdb"/>
      <stop offset="1" stop-color="#dfcfae"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.26  0 0 0 0 0.15  0 0 0 0.16 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5a4426" flood-opacity="0.22"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#fff" filter="url(#grain)"/>
  <g transform="rotate(-4 512 512)" filter="url(#lift)">
    <rect x="262" y="342" width="500" height="340" rx="40" fill="#fbf7ee" stroke="#3b3226" stroke-width="40" stroke-linejoin="round"/>
    <path d="M286 372 L512 548 L738 372" fill="none" stroke="#3b3226" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
