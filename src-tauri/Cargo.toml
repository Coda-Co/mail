[package]
name = "mail-app"
description = "A lightweight mail and calendar app for Microsoft 365"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mail_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Auto-update from the private release channel. Needs plugins.updater in the config (see docs/RELEASING.md).
updater = ["dep:tauri-plugin-updater"]

[dependencies]
mail-core = { path = "../crates/mail-core", features = ["os-keyring"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
chrono.workspace = true
tracing.workspace = true
sha2 = "0.10"
