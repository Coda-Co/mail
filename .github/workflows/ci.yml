name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build the MCP sidecar
        shell: bash
        run: |
          cargo build --release -p mail-mcp
          mkdir -p src-tauri/binaries
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/release/mail-mcp$ext" "src-tauri/binaries/mail-mcp-${{ matrix.target }}$ext"
      - name: Build the app (unsigned)
        env:
          MAIL_APP_CLIENT_ID: ${{ vars.MAIL_APP_CLIENT_ID }}
          MAIL_APP_SECURITY_NOTE_URL: ${{ vars.MAIL_APP_SECURITY_NOTE_URL }}
        run: npx tauri build -c src-tauri/tauri.bundle.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: mail-${{ matrix.target }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
